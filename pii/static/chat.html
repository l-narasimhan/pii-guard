<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PII Guard Demo</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #6b7385; --line: #e3e6ec;
  --accent: #2f6fde; --ok: #1f9d55; --bad: #d64545;
  --name: #e8f0ff; --addr: #fff2dc; --num: #e9f8ee; --id: #fde8f0; --net: #efeaff;
  --name-ink: #2554b3; --addr-ink: #9a5b00; --num-ink: #1b7a43; --id-ink: #a3305d; --net-ink: #5b3fb3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1f28; --ink: #e7eaf0; --muted: #98a1b3; --line: #2a3140;
    --accent: #6c9cff; --ok: #4cc283; --bad: #ff7676;
    --name: #1f2f52; --addr: #3d2f14; --num: #173a27; --id: #3d1c2a; --net: #2a2350;
    --name-ink: #9cbcff; --addr-ink: #ffc56b; --num-ink: #7fe0a8; --id-ink: #ff9cc2; --net-ink: #c2b2ff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--panel); }
header h1 { font-size: 17px; margin: 0; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.pill.bad { color: var(--bad); border-color: var(--bad); }
.spacer { flex: 1; }
button, select { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 190px); min-height: 300px; }
.col { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.col:last-child { border-right: 0; }
.col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; white-space: pre-wrap; word-break: break-word; }
.bubble .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.bubble.blocked { border-color: var(--bad); color: var(--bad); }
mark { border-radius: 4px; padding: 0 3px; }
.tok { display: inline-block; border-radius: 6px; padding: 0 5px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; font-weight: 600; }
.c-name { background: var(--name); color: var(--name-ink); }
.c-addr { background: var(--addr); color: var(--addr-ink); }
.c-num { background: var(--num); color: var(--num-ink); }
.c-id { background: var(--id); color: var(--id-ink); }
.c-net { background: var(--net); color: var(--net-ink); }
footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; }
.composer { display: flex; gap: 8px; }
textarea { flex: 1; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; min-height: 44px; max-height: 160px; }
.preview { font-size: 13px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; word-break: break-word; min-height: 20px; }
.samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.samples button { font-size: 12px; padding: 3px 8px; }
#vault { position: fixed; right: 16px; bottom: 16px; width: min(360px, calc(100vw - 32px)); max-height: 50vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.15); display: none; font-size: 13px; }
#vault table { width: 100%; border-collapse: collapse; }
#vault td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
#vault .warn { color: var(--bad); font-size: 12px; margin-bottom: 6px; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; height: auto; }
  .col { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  header, footer { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>PII Guard: live redaction</h1>
  <span id="health" class="pill">checking…</span>
  <span id="stats" class="pill">0 messages</span>
  <span class="spacer"></span>
  <label class="pill">mode
    <select id="mode" title="token = reversible [NAME_1] with vault; mask = irreversible [NAME]">
      <option value="token">token (support chat)</option>
      <option value="mask">mask (analytics/logs)</option>
    </select>
  </label>
  <button id="showVault">Vault</button>
  <button id="reset">New conversation</button>
</header>

<main>
  <section class="col">
    <h2>What the customer typed (never stored)</h2>
    <div id="raw" class="msgs"></div>
  </section>
  <section class="col">
    <h2>What the agent / AI receives</h2>
    <div id="red" class="msgs"></div>
  </section>
</main>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="Type like a customer… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" class="primary">Send</button>
  </div>
  <div id="preview" class="preview"></div>
  <div class="samples" id="samples"></div>
</footer>

<div id="vault">
  <div class="warn">Demo only: in production the vault is access-controlled and never shown in a UI.</div>
  <table id="vaultTable"></table>
</div>

<script>
const SAMPLES = [
  ["Hinglish", "hi mera order nahi aaya. Ramesh Kumar here, 98450 12345. order FK-778812"],
  ["Landmark address", "deliver to 3rd house after Raju tea stall, blue gate, Vidyaranyapura pls"],
  ["Name again", "Ramesh bol raha hoon, same number pe call karo"],
  ["Refund", "refund to ramesh.k@okaxis, PAN ABCPK1234M, a/c no 50100234567812"],
  ["Disguised", "my no is 98450 1234O, or mail ramesh dot kumar at gmail dot com"],
  ["Kannada", "nanna hesaru Manjunath, number 9741203345 ge call maadi"],
  ["Not PII", "AWB 783420019812 stuck. Ordered from Lakshmi Stores before Ganesh Chaturthi, pincode 560066"],
  ["KYC doc", "CUSTOMER KYC FORM\nName: Suresh Iyer\nDOB: 12-07-1979\nAadhaar: 9536 4556 8158\nMobile: 98450 12345"],
];
const COLORS = {NAME: "c-name", ADDRESS: "c-addr", PHONE: "c-num", EMAIL: "c-net", UPI: "c-net", IP: "c-net",
  AADHAAR: "c-id", PAN: "c-id", GSTIN: "c-id", CARD: "c-id", BANK_ACCT: "c-id", PASSPORT: "c-id",
  VOTER_ID: "c-id", VEHICLE: "c-id", DOB: "c-id", DL: "c-id"};
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let cid = "demo-" + Math.random().toString(36).slice(2, 8);
let count = 0, totalMs = 0, previewTimer = null;

async function api(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error || "failed"), {blocked: j.blocked});
  return j;
}

function highlight(text, entities) {
  let html = "", cur = 0;
  for (const e of [...entities].sort((a, b) => a.start - b.start)) {
    html += esc(text.slice(cur, e.start));
    html += `<mark class="${COLORS[e.label] || "c-id"}" title="${e.label} (${e.source})">${esc(text.slice(e.start, e.end))}</mark>`;
    cur = e.end;
  }
  return html + esc(text.slice(cur));
}

function tokens(redacted) {
  return esc(redacted).replace(/\[([A-Z_]+?)(_\d+)?\]/g, (m, lab) => `<span class="tok ${COLORS[lab] || "c-id"}">${m}</span>`);
}

function bubble(where, html, meta, cls = "") {
  const d = document.createElement("div");
  d.className = "bubble " + cls;
  d.innerHTML = html + (meta ? `<div class="meta">${meta}</div>` : "");
  $(where).appendChild(d);
  $(where).scrollTop = $(where).scrollHeight;
}

async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = ""; $("preview").textContent = "";
  try {
    const r = await api("/redact", {text, conversation_id: cid, mode: $("mode").value});
    const labels = [...new Set(r.entities.map((e) => e.label))].join(", ") || "no PII found";
    bubble("raw", highlight(text, r.entities), labels);
    bubble("red", tokens(r.redacted), `${r.entities.length} redacted · ${r.ms} ms · ${r.mode}`);
    count++; totalMs += r.ms;
    $("stats").textContent = `${count} messages · avg ${(totalMs / count).toFixed(1)} ms`;
    if ($("vault").style.display === "block") loadVault();
  } catch (e) {
    bubble("raw", esc(text), "not delivered");
    bubble("red", "Message blocked: redaction service unavailable (fail-closed).", "", "blocked");
  }
}

async function preview() {
  const text = $("input").value;
  if (!text.trim()) { $("preview").textContent = ""; return; }
  try {
    const r = await api("/redact", {text, mode: "mask"});   // stateless preview: no conversation, nothing stored
    $("preview").innerHTML = "Preview → " + tokens(r.redacted) + ` <span style="opacity:.7">(${r.ms} ms)</span>`;
  } catch { $("preview").textContent = "Preview unavailable"; }
}

async function loadVault() {
  const {vault} = await api("/vault", {conversation_id: cid});
  const rows = Object.entries(vault).map(([t, v]) => `<tr><td><span class="tok ${COLORS[t.slice(1).replace(/_\d+\]$/, "")] || "c-id"}">${esc(t)}</span></td><td>${esc(v)}</td></tr>`);
  $("vaultTable").innerHTML = rows.join("") || "<tr><td>empty</td></tr>";
}

$("send").onclick = send;
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("input").addEventListener("input", () => { clearTimeout(previewTimer); previewTimer = setTimeout(preview, 150); });
$("showVault").onclick = () => {
  const v = $("vault"); v.style.display = v.style.display === "block" ? "none" : "block";
  if (v.style.display === "block") loadVault();
};
$("reset").onclick = async () => {
  await api("/reset", {conversation_id: cid});
  cid = "demo-" + Math.random().toString(36).slice(2, 8);
  $("raw").innerHTML = ""; $("red").innerHTML = ""; count = 0; totalMs = 0;
  $("stats").textContent = "0 messages"; if ($("vault").style.display === "block") loadVault();
};
for (const [label, text] of SAMPLES) {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = () => { $("input").value = text; preview(); $("input").focus(); };
  $("samples").appendChild(b);
}
fetch("/health").then((r) => r.json()).then((h) => {
  $("health").textContent = "service ok · " + h.model_version; $("health").className = "pill ok";
}).catch(() => { $("health").textContent = "service down"; $("health").className = "pill bad"; });
</script>
</body>
</html>
